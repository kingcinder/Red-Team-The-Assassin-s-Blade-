# ═══════════════════════════════════════════════════════════════
# RedTeam Harness — Configuration
# Kali Linux Complete — 140+ tools across 14 categories
# ═══════════════════════════════════════════════════════════════

# LLM Backend Configuration
llm:
  backend: "llama-server"
  llama-server:
    host: "127.0.0.1"
    port: 8080
    model: "Carnice-Qwen3.6-MoE-35B-A3B-APEX-MTP-I-Quality.gguf"
    # Generation / I/O tuning — all read from this section at backend startup.
    # Per-call kwargs at any LLMBackend call site still override these.
    max_tokens: 4096
    # 0.6 matches the tuned sampler stack in launch-gguf.sh. Lower values
    # (0.2-0.3) make the Qwen3.6 MoE models over-enumerate port lists in
    # nmap tool_calls; 0.6 gives clean, focused tool JSON.
    temperature: 0.6
    # 300s: the 35B MTP decodes at ~3-5 tok/s on this box, and a tool_call
    # response over a long engagement context can exceed 120s. 120s was
    # observed to abort otherwise-healthy generations mid-flight.
    timeout: 300
    # Reasoning effort sent to llama-server. "none" (default) disables  thinking
    # blocks so the agentic loop gets direct answers — thinking models
    # otherwise burn the whole token budget and return EMPTY content, which
    # the harness reads as a failure. Set to "low"/"medium"/"high" to
    # re-enable model reasoning when you want it.
    reasoning_effort: "none"
  ollama:
    host: "127.0.0.1"
    port: 11434
    model: "qwen3.6"
    max_tokens: 4096
    temperature: 0.3
    timeout: 120

# Harness Configuration
harness:
  host: "127.0.0.1"
  port: 9999
  debug: false
  max_tool_retries: 3
  tool_timeout: 300
  max_parallel_tools: 3
  session_dir: "./sessions"
  output_dir: "./output"

# Workflow Engine Configuration (v4.0)
workflow:
  templates_dir: "./workflows/templates"
  tasks_dir: "./tasks"
  overall_timeout: 3600
  max_steps: 50
  max_retries_per_step: 3
  auto_resume: true
  # Hardening limits
  max_output_chars: 100000
  max_concurrent_tools: 3
  # Multi-target scheduler (v3.2)
  max_concurrent_targets: 3
  max_targets_per_run: 50
  # LLM workflow generator (v3.2)
  generator_max_steps: 20
  generator_max_arg_len: 500
  # Post-execution template self-improvement (v4.2)
  template_self_improve: true
  # Workflow chaining (v4.3)
  chain_max_links: 3

# v4.0 Assassin's Blade Configuration
assassins_blade:
  # Phase 2: Result Cache
  cache_max_size: 256
  cache_ttl_seconds: 600
  # Phase 3: Context Window
  context_max_tokens: 32768
  # Phase 4: Reasoning
  reasoning_best_of_n: 3
  reasoning_self_evaluate: true
  reasoning_reflection_steps: 2
  # Phase 5: Tactical Engine
  tactics_auto_run_threshold: 0.85
  tactics_suggest_threshold: 0.50
  # Phase 6: Drift Hardening
  drift_confidence_threshold: 0.7
  drift_require_self_critique: true
  # Phase 7: Target Prioritization
  prioritizer_max_targets: 100
  prioritizer_parallel_scans: true
  # v5.2: LLM-driven auto target prioritization (ranks targets by
  # exploitability before the multi-target scheduler; heuristic fallback
  # when the LLM is unavailable)
  prioritizer_llm_enabled: true

# Safety & Scope Configuration (unrestricted mode — all guardrails removed)
# No confirmation gates, no allowed-scope, no blocked targets: every tool
# runs unconditionally. The SafetyEngine is a pass-through regardless of
# these values.
safety:
  require_confirmation: []
  allowed_targets: []
  blocked_targets: []
  log_all_commands: true

