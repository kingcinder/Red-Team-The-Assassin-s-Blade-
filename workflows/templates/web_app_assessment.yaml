name: "Web Application Assessment"
description: "Full web app pentest chain: fingerprint → WAF detect → directory brute → vulnerability scan → content discovery."
category: web
attack_vector: "Web application attack surface enumeration"
variables:
  url:
    required: true
    description: "Target URL (e.g. http://192.168.1.10)"
  wordlist:
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    description: "Wordlist for directory brute force"
cutting_edge: false
references: ["OWASP Top 10", "PTES Web Application Testing"]

steps:
  - name: "web_fingerprint"
    tool: "whatweb_scan"
    description: "Fingerprint web technologies (CMS, frameworks, servers)"
    args:
      target: "{{url}}"
      aggression: 3
    expected_output: ".+"
    timeout: 120
    gate: true
    retries: 2

  - name: "waf_detect"
    tool: "waf_detect"
    description: "Detect if a Web Application Firewall protects the target"
    args:
      target: "{{url}}"
    expected_output: null
    timeout: 60
    gate: false
    retries: 2

  - name: "dir_bruteforce"
    tool: "gobuster_dir"
    description: "Discover hidden directories and files"
    args:
      url: "{{url}}"
      wordlist: "{{wordlist}}"
      threads: 20
    expected_output: "Status: (200|301|302|401|403)"
    timeout: 600
    gate: false
    retries: 2

  - name: "nikto_scan"
    tool: "nikto_scan"
    description: "Scan for dangerous files, outdated software, misconfigurations"
    args:
      target: "{{url}}"
    expected_output: null
    timeout: 600
    gate: false
    retries: 1

  - name: "nuclei_scan"
    tool: "nuclei_scan"
    description: "Fast vulnerability scanning with YAML templates"
    args:
      target: "{{url}}"
    expected_output: null
    timeout: 600
    gate: false
    retries: 2
