name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (17 suites + compile + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all 17 test suites
        run: |
          for t in tests/test_*.py; do
            echo "=== $t ==="
            python3 "$t" || exit 1
          done
          echo "ALL TEST SUITES PASSED"

      - name: Python compile check
        run: |
          python3 -c "import py_compile,glob; [py_compile.compile(f,doraise=True) for f in glob.glob('core/*.py')+glob.glob('dashboard/*.py')+glob.glob('tools/*.py')+glob.glob('tests/*.py')+glob.glob('*.py')]"
          echo "PY COMPILE OK"

      - name: JS syntax check
        run: |
          node --check dashboard/static/js/cockpit.js
          echo "JS OK"

      - name: Import smoke (every module loads)
        run: |
          python3 tests/smoke_imports.py
          echo "IMPORT SMOKE OK"
